name: CI

# Typecheck + tests for the monorepo (protocol, docs engine, vault, web) on every
# PR and on pushes to main. Deployment (CD) is handled by Vercel, which builds
# and ships the web app on push to main — this job is the pre-merge safety net.
on:
  pull_request:
  push:
    branches: [main]

# One run per ref; a new push cancels the previous in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
