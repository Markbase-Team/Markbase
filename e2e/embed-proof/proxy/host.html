<!doctype html><meta charset="utf-8"><title>fake MCP Apps host</title>
<style>html,body{margin:0;height:100%} iframe{border:0;width:100%;height:100%}</style>
<iframe id="card"></iframe>
<script>
  // Stands in for Claude's side of a card: it holds the connector's key (as
  // Claude's server does), loads the card, answers its handshake, hands it the
  // tool's answer, runs the tools it calls (to the real API), and grants full
  // page. Query: app (instance), key, doc, sandbox.
  const q = new URLSearchParams(location.search);
  const APP = q.get("app"), KEY = q.get("key"), DOC = q.get("doc"), CARD = q.get("card") || "app";
  // Which sites the host lets into the card's frame policy, as Claude reports
  // it: "allowed" (the instance), "blocked" (none), or unset (not reported).
  const FRAMES = q.get("frames");
  // "silent": block the frame with this page's own policy and report nothing,
  // which is what Claude does today.
  if (FRAMES === "silent") {
    const policy = document.createElement("meta");
    policy.httpEquiv = "Content-Security-Policy";
    policy.content = "frame-src 'self'";
    document.head.appendChild(policy);
  }
  const card = document.getElementById("card");
  card.setAttribute("sandbox", q.get("sandbox") || "allow-scripts allow-same-origin allow-forms allow-popups");
  window.hostLog = [];
  const TOOLS = {
    me_embedSession: { method: "POST", path: () => "/me/embed/session" },
    docs_readDoc: { method: "GET", path: (args) => "/docs/" + encodeURIComponent(args.id) },
  };
  window.addEventListener("message", async (e) => {
    if (e.source !== card.contentWindow) return;
    const m = e.data, post = (msg) => card.contentWindow.postMessage(msg, "*");
    const reply = (result) => post({ jsonrpc: "2.0", id: m.id, result });
    const refuse = (message) => post({ jsonrpc: "2.0", id: m.id, error: { code: -32000, message } });
    window.hostLog.push(m.method || "response");
    if (m.method === "ui/initialize") {
      const sandbox = FRAMES === "allowed" || FRAMES === "blocked" ? { sandbox: { csp: { frameDomains: FRAMES === "allowed" ? [APP] : [] } } } : {};
      reply({ protocolVersion: "2026-01-26", hostInfo: { name: "fake", version: "0" }, hostCapabilities: { openLinks: {}, serverTools: {}, ...sandbox },
        hostContext: { theme: "light", displayMode: "inline", availableDisplayModes: ["inline", "fullscreen"] } });
    } else if (m.method === "ui/notifications/initialized") {
      post({ jsonrpc: "2.0", method: "ui/notifications/tool-input", params: { arguments: { doc: DOC } } });
      // The app card is drawn for me_openApp's answer; the document card for docs_readDoc's.
      const answer = CARD === "doc"
        ? { doc: { id: DOC, title: "Welcome to Markbase", version: 1, content: "# Welcome to Markbase\n\nThe card's own view." }, capability: "owner" }
        : { doc_id: DOC };
      post({ jsonrpc: "2.0", method: "ui/notifications/tool-result", params: { content: [{ type: "text", text: JSON.stringify(answer) }], isError: false } });
    } else if (m.method === "ui/open-link") {
      window.openedLink = m.params.url;
      reply({});
    } else if (m.method === "ui/request-display-mode") {
      window.fullscreenRequested = m.params.mode;
      reply({ mode: m.params.mode });
    } else if (m.method === "tools/call") {
      const tool = TOOLS[m.params.name];
      if (!tool) return refuse("Unknown tool");
      const args = m.params.arguments || {};
      const res = await fetch(APP + "/api/v1" + tool.path(args), tool.method === "GET"
        ? { headers: { authorization: "Bearer " + KEY } }
        : { method: tool.method, headers: { authorization: "Bearer " + KEY, "content-type": "application/json" }, body: JSON.stringify(args) });
      const text = await res.text();
      if (m.params.name === "me_embedSession") window.handOffStatus = res.status;
      reply({ content: [{ type: "text", text: res.ok ? text : "HTTP " + res.status + "\n" + text }], isError: !res.ok });
    } else if (m.id !== undefined && m.method) reply({});
  });
  fetch(CARD === "doc" ? "doc-card.html" : "app-card.html").then((r) => r.text()).then((html) => { card.srcdoc = html; });
</script>
